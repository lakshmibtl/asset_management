{% extends 'asset_app/base.html' %}
{% load static %}

{% block title %}Edit Assignment{% endblock %}

{% block content %}
<style>
    :root {
        --primary: #07518A;
        --primary-2: #0d6efd;
        --grad-primary: linear-gradient(135deg, #07518A 0%, #0d6efd 100%);
        --glass-bg: rgba(255, 255, 255, 0.88);
        --input-border: #e2e8f0;
        --radius: 22px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .assign-hero {
        background: var(--grad-primary);
        border-radius: var(--radius);
        padding: 2rem 2.2rem;
        color: #fff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(7, 81, 138, 0.28);
    }

    .assign-hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -70px;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 70%);
    }

    .assign-hero .hero-badge {
        display: inline-flex;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.35);
        font-size: 1.6rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    }

    .assign-hero h1 {
        font-weight: 800;
        letter-spacing: -0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
    }

    .card-modern {
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: var(--radius);
        box-shadow: 0 24px 50px rgba(7, 81, 138, 0.1);
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
    }

    .card-top {
        height: 8px;
        background: var(--grad-primary);
    }

    .section-indicator {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--primary);
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, rgba(7, 81, 138, 0.1), rgba(13, 110, 253, 0.16));
    }

    .form-control,
    .form-select {
        border: 1.5px solid var(--input-border) !important;
        border-radius: 12px !important;
        padding: 10px 15px !important;
        height: auto !important;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(7, 81, 138, 0.12) !important;
    }

    .readonly-box {
        background-color: #f8fafc !important;
        border-style: dashed !important;
        color: var(--primary);
        font-weight: 600;
    }

    .btn-assign {
        background: var(--grad-primary);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-weight: 700;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 14px 30px rgba(7, 81, 138, 0.35);
    }

    .btn-assign:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 40px rgba(7, 81, 138, 0.42);
        color: white;
        filter: brightness(1.07);
    }

    .emp-picker {
        position: relative;
    }

    .emp-results {
        display: none;
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 1080;
        background: #fff;
        border: 1px solid var(--input-border);
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(7, 81, 138, 0.18);
        max-height: 260px;
        overflow-y: auto;
    }

    .emp-item {
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.15s ease;
    }

    .emp-item:last-child {
        border-bottom: none;
    }

    .emp-item:hover,
    .emp-item.emp-active {
        background: linear-gradient(135deg, rgba(7, 81, 138, 0.08), rgba(13, 110, 253, 0.12));
    }

    .emp-item-name {
        font-weight: 700;
        color: var(--primary);
        font-size: 0.92rem;
    }

    .emp-item-meta {
        font-size: 0.78rem;
        color: #64748b;
        margin-top: 2px;
    }

    .emp-empty {
        padding: 14px;
        color: #94a3b8;
        text-align: center;
        font-size: 0.85rem;
    }
</style>

<div class="container py-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'assigned_employees' %}" class="btn rounded-circle me-3"
            style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--glass-bg); border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(7, 81, 138, 0.08); color: var(--primary);"
            title="Go Back">
            <i class="bi bi-arrow-left fs-5"></i>
        </a>
        <div class="assign-hero d-flex align-items-center gap-4 flex-grow-1 mb-0">
            <div class="hero-badge d-none d-sm-inline-flex">
                <i class="bi bi-pencil-square"></i>
            </div>
            <div>
                <h1 class="mb-1"><i class="bi bi-pencil-square me-2"></i>Edit Assignment</h1>
                <p class="mb-0">{{ assignment.asset.asset_type }} #{{ assignment.asset.asset_id }}</p>
            </div>
        </div>
    </div>

    <form method="POST" id="editForm">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card card-modern p-4 h-100">
                    <div class="card-top"></div>
                    <span class="section-indicator mt-3">
                        <span class="step-num"><i class="bi bi-person-fill" style="font-size:0.75rem;"></i></span>
                        Recipient
                    </span>

                    <div class="mb-2">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-person-search me-1" style="color: var(--primary);"></i> RECIPIENT</label>
                        <select name="employee" id="empSelect" class="form-select" required>
                            <option value="">Select employee...</option>
                            {% for emp in employees %}
                            <option value="{{ emp.pk }}" data-dept="{{ emp.department|default:'' }}" data-branch="{{ emp.branch|default:'' }}" {% if assignment.employee_id == emp.pk %}selected{% endif %}>{{ emp.name }} [{{ emp.employee_id }}]</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label class="form-label small text-muted">Department</label>
                            <input type="text" id="empDept" class="form-control readonly-box" readonly value="{{ assignment.employee.department|default:'—' }}">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small text-muted">Branch</label>
                            <input type="text" id="empBranch" class="form-control readonly-box" readonly value="{{ assignment.employee.branch|default:'—' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card card-modern p-4 h-100">
                    <div class="card-top" style="background: linear-gradient(135deg,#15803d,#22c55e);"></div>
                    <span class="section-indicator mt-3" style="background: linear-gradient(135deg, rgba(34,197,94,.1), rgba(34,197,94,.18)); color:#15803d;">
                        <span class="step-num" style="background: linear-gradient(135deg,#15803d,#22c55e);"><i class="bi bi-cpu-fill" style="font-size:0.75rem;"></i></span>
                        Allocation
                    </span>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-calendar-event me-1" style="color: var(--primary);"></i> ASSIGNMENT DATE</label>
                        <input type="text" name="assigned_date" class="form-control" placeholder="DD/MM/YYYY" autocomplete="off" value="{{ today_date_display }}">
                        <div class="form-text">Format: DD/MM/YYYY</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-broadcast me-1" style="color: var(--primary);"></i> DEPLOYMENT STATUS</label>
                        <select name="status" id="assignStatusSelect" class="form-select">
                            <option value="In Use" {% if assignment.status == 'In Use' %}selected{% endif %}>In Use</option>
                            <option value="Temporary" {% if assignment.status|lower == 'temporary' %}selected{% endif %}>Temporary User</option>
                            <option value="Other" {% if assignment.status != 'In Use' and assignment.status|lower != 'temporary' and assignment.status|lower != 'temporary use' %}selected{% endif %}>Other (Enter Manually)</option>
                        </select>
                        <input type="text" id="otherStatusInput" name="other_status" class="form-control mt-2" placeholder="Enter custom status (e.g. Abscond)" style="display: none;" value="{% if assignment.status not in 'In Use,Returned,Temporary,Temporary Use' %}{{ assignment.status }}{% endif %}">
                    </div>

                    <div class="mt-auto">
                        <button type="submit" class="btn btn-assign w-100 shadow-sm">
                            <i class="bi bi-check-circle me-2"></i> Save Assignment
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    (function () {
        const statusSelect = document.getElementById('assignStatusSelect');
        const otherStatusInput = document.getElementById('otherStatusInput');
        const empSelect = document.getElementById('empSelect');
        const empDept = document.getElementById('empDept');
        const empBranch = document.getElementById('empBranch');

        function updateStatusMode() {
            if (statusSelect.value === 'Other') {
                otherStatusInput.style.display = 'block';
                otherStatusInput.required = true;
            } else {
                otherStatusInput.style.display = 'none';
                otherStatusInput.required = false;
            }
        }

        if (statusSelect) statusSelect.addEventListener('change', updateStatusMode);
        updateStatusMode();

        if (empSelect) {
            empSelect.addEventListener('change', function () {
                const opt = empSelect.options[empSelect.selectedIndex];
                empDept.value = opt.dataset.dept || '—';
                empBranch.value = opt.dataset.branch || '—';
            });
        }

        const form = document.getElementById('editForm');
        if (form) {
            form.addEventListener('submit', function () {
                var btn = form.querySelector('button[type="submit"]');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Saving...';
                }
            });
        }
    })();
</script>
{% endblock %}
