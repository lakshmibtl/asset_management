{% extends 'asset_app/base.html' %}
{% load static %}

{% block title %}Assign Asset{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

<style>
    :root {
        --primary: #07518A;
        --primary-2: #0d6efd;
        --grad-primary: linear-gradient(135deg, #07518A 0%, #0d6efd 100%);
        --glass-bg: rgba(255, 255, 255, 0.88);
        --input-border: #e2e8f0;
        --radius: 22px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============ HERO ============ */
    .assign-hero {
        background: var(--grad-primary);
        border-radius: var(--radius);
        padding: 2.2rem 2.4rem;
        color: #fff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(7, 81, 138, 0.28);
    }

    .assign-hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -70px;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 70%);
    }

    .assign-hero .hero-badge {
        display: inline-flex;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.35);
        font-size: 1.6rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    }

    .assign-hero h1 {
        font-weight: 800;
        letter-spacing: -0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
    }

    .assign-hero p {
        opacity: 0.9;
    }

    /* ============ CARDS ============ */
    .card-modern {
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: var(--radius);
        box-shadow: 0 24px 50px rgba(7, 81, 138, 0.1);
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
    }

    .card-top {
        height: 8px;
        background: var(--grad-primary);
    }

    .section-indicator {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--primary);
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, rgba(7, 81, 138, 0.1), rgba(13, 110, 253, 0.16));
    }

    .step-num {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--grad-primary);
        color: #fff;
        font-weight: 800;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(7, 81, 138, 0.3);
    }

    /* ============ INPUTS ============ */
    .form-control,
    .form-select,
    .select2-container--default .select2-selection--single {
        border: 1.5px solid var(--input-border) !important;
        border-radius: 12px !important;
        padding: 10px 15px !important;
        height: auto !important;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(7, 81, 138, 0.12) !important;
    }

    .readonly-box {
        background-color: #f8fafc !important;
        border-style: dashed !important;
        color: var(--primary);
        font-weight: 600;
        transition: all 0.3s ease;
    }

    /* ============ SUBMIT ============ */
    .btn-assign {
        background: var(--grad-primary);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-weight: 700;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 14px 30px rgba(7, 81, 138, 0.35);
    }

    .btn-assign:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 40px rgba(7, 81, 138, 0.42);
        color: white;
        filter: brightness(1.07);
    }

    /* Visual pulse for data updates */
    .data-update-flash {
        animation: pulse 0.5s ease-in-out;
    }

    @keyframes pulse {
        0% {
            background-color: #f8fafc;
        }

        50% {
            background-color: #e0f2fe;
        }

        100% {
            background-color: #f8fafc;
        }
    }
</style>

<div class="container py-4">

    <!-- HERO -->
    <div class="assign-hero d-flex align-items-center gap-4 mb-4 animate__animated animate__fadeInDown">
        <div class="hero-badge d-none d-sm-inline-flex">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <div>
            <h1 class="mb-1"><i class="bi bi-broadcast-pin me-2"></i>Asset Assignment</h1>
            <p class="mb-0">Quickly allocate company hardware to verified staff.</p>
        </div>
    </div>

    <form method="POST" id="assignForm">
        {% csrf_token %}

        <div class="row g-4">
            <div class="col-lg-5 animate__animated animate__fadeInLeft">
                <div class="card card-modern p-4 h-100">
                    <div class="card-top"></div>
                    <span class="section-indicator mt-3">
                        <span class="step-num"><i class="bi bi-person-fill" style="font-size:0.75rem;"></i></span>
                        Step 1 — Recipient
                    </span>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-person-search me-1"
                                style="color: var(--primary);"></i> EMPLOYEE SEARCH</label>
                        <select id="empSelect" name="employee" class="form-control select2-modern" required>
                            <option value="">Search by ID or Name...</option>
                            {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.employee_id }} — {{ emp.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <label class="form-label small text-muted">Full Name</label>
                            <input type="text" id="empName" class="form-control readonly-box" readonly placeholder="—">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label small text-muted">Department</label>
                            <input type="text" id="empDept" class="form-control readonly-box" readonly placeholder="—">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label small text-muted">Branch</label>
                            <input type="text" id="empBranch" name="branch" class="form-control" placeholder="—">
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label fw-bold small text-muted">
                            <i class="bi bi-calendar-event me-1" style="color: var(--primary);"></i>
                            ASSIGNMENT DATE
                        </label>

                        <input type="text" name="assigned_date" class="form-control" id="assignDatePicker"
                            placeholder="DD/MM/YYYY" autocomplete="off" value="{{ today_date_display }}">
                        <div class="form-text">Format: DD/MM/YYYY</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7 animate__animated animate__fadeInRight">
                <div class="card card-modern p-4 h-100">
                    <div class="card-top" style="background: linear-gradient(135deg,#15803d,#22c55e);"></div>
                    <span class="section-indicator mt-3"
                        style="background: linear-gradient(135deg, rgba(34,197,94,.1), rgba(34,197,94,.18)); color:#15803d;">
                        <span class="step-num" style="background: linear-gradient(135deg,#15803d,#22c55e);"><i
                                class="bi bi-cpu-fill" style="font-size:0.75rem;"></i></span>
                        Step 2 — Allocation
                    </span>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-box-seam me-1"
                                style="color: var(--primary);"></i> SELECT EQUIPMENT</label>
                        <select name="asset" class="form-control select2-modern" required>
                            <option value="">Choose an available asset...</option>
                            {% for a in assets %}
                            <option value="{{ a.pk }}" {% if pre_selected_asset|stringformat:"s" == a.pk|stringformat:"s" %}selected{% endif %}>{{ a.asset_type }} [{{ a.asset_id }}]</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted"><i class="bi bi-broadcast me-1"
                                style="color: var(--primary);"></i> DEPLOYMENT STATUS</label>
                        <select name="status" class="form-select">
                            <option value="In Use">In Use</option>
                            <option value="Temporary">Temporary Use</option>
                        </select>
                    </div>

                    <div class="mt-auto">
                        <button type="submit" id="submitBtn" class="btn btn-assign w-100 shadow-sm">
                            <span id="btnText">Finalize Assignment <i class="bi bi-arrow-right-circle ms-2"></i></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    $(document).ready(function () {
        // 1. Initialize Select2
        $('.select2-modern').select2({
            width: '100%',
            dropdownAutoWidth: true
        });

        const empSelect = $('#empSelect');
        const empName = $('#empName');
        const empDept = $('#empDept');
        const empBranch = $('#empBranch');

        // 2. AJAX Employee Data Fetch
        empSelect.on('change', function () {
            const empId = $(this).val();

            if (!empId) {
                empName.val('—');
                empDept.val('—');
                empBranch.val('—');
                return;
            }

            // Show loading state visually
            empName.val('Syncing...');
            empDept.val('Syncing...');
            empBranch.val('Syncing...');

            $.ajax({
                url: '/asset/ajax/get-employee/', // Ensure this matches your URL configuration
                method: 'GET',
                data: { 'emp_id': empId },
                dataType: 'json',
                success: function (data) {
                    // Apply data to fields
                    empName.val(data.name || 'Not Found');
                    empDept.val(data.department || 'Not Found');
                    empBranch.val(data.branch || 'Not Found');

                    // Visual feedback that data has updated
                    $('.readonly-box').addClass('data-update-flash');
                    setTimeout(() => $('.readonly-box').removeClass('data-update-flash'), 500);
                },
                error: function (xhr) {
                    console.error("Error Response:", xhr.responseText);
                    empName.val('Error fetching');
                    empDept.val('Error fetching');
                    empBranch.val('Error fetching');
                }
            });
        });

        // 3. Form Submission Handling
        const ASSIGN_TODAY = "{{ today_date }}";
        const todayDateObj = new Date(ASSIGN_TODAY + 'T00:00:00');

        function parseAssignedDate(s) {
            const m = (s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!m) return null;
            const d = new Date(+m[3], (+m[2]) - 1, +m[1]);
            return (d.getDate() === +m[1] && d.getMonth() === (+m[2]) - 1) ? d : null;
        }

        const assignDatePickerEl = document.getElementById('assignDatePicker');
        if (assignDatePickerEl && window.__dmy && window.__dmy['assignDatePicker']) {
            window.__dmy['assignDatePicker'].set('maxDate', ASSIGN_TODAY);
        }

        $('#assignForm').on('submit', function () {
            const dateInput = this.querySelector('input[name="assigned_date"]');
            if (dateInput && dateInput.value) {
                const parsed = parseAssignedDate(dateInput.value);
                if (parsed && parsed > todayDateObj) {
                    dateInput.value = '';
                    dateInput.setCustomValidity('Future dates are not allowed.');
                    dateInput.reportValidity();
                    return false;
                }
                dateInput.setCustomValidity('');
            }
            if (this.checkValidity()) {
                $('#submitBtn').prop('disabled', true);
                $('#btnText').html('<span class="spinner-border spinner-border-sm me-2"></span> Processing Registry...');
            }
        });

        document.getElementById('assignForm').querySelector('input[name="assigned_date"]').addEventListener('change', function () {
            const parsed = parseAssignedDate(this.value);
            if (parsed && parsed > todayDateObj) {
                this.value = '';
            }
        });
    });
</script>
{% endblock %}
