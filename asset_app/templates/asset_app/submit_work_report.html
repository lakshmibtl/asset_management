{% extends 'asset_app/base.html' %}

{% block content %}
<style>
    :root {
        --brand: #07518A;
        --brand-hover: #064a7d;
        --brand-soft: #eaf2fa;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --sha-card: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    }

    body {
        background: #f3f6f9;
    }

    .wr-crumb {
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 0.02em;
    }

    .wr-crumb a {
        color: var(--muted);
        text-decoration: none;
    }

    .wr-crumb a:hover {
        color: var(--brand);
    }

    .wr-crumb .sep {
        margin: 0 0.4rem;
        color: #b6bdc7;
    }

    .wr-page-head h2 {
        color: var(--ink);
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
    }

    .wr-page-head p {
        color: var(--muted);
        font-size: 0.92rem;
        margin: 4px 0 0;
    }

    .wr-card {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--sha-card);
        overflow: hidden;
    }

    .wr-card-head {
        padding: 16px 26px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .wr-card-head .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--brand);
        flex-shrink: 0;
    }

    .wr-card-head h6 {
        margin: 0;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .wr-card-body {
        padding: 26px;
    }

    .wr-card-foot {
        padding: 16px 26px;
        border-top: 1px solid var(--line);
        background: #fafbfc;
        border-radius: 0 0 14px 14px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .f-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
        letter-spacing: 0.01em;
    }

    .wr-card .form-control {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.9rem;
        color: var(--ink);
        background: #fbfcfd;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .wr-card .form-control:focus {
        outline: none;
        border-color: var(--brand);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(7, 81, 138, 0.12);
    }

    .btn-brand {
        background: var(--brand);
        color: #fff;
        border: 1px solid var(--brand);
        border-radius: 10px;
        padding: 10px 24px;
        font-size: 0.88rem;
        font-weight: 600;
        transition: background 0.15s ease;
    }

    .btn-brand:hover {
        background: var(--brand-hover);
        color: #fff;
    }

    .btn-ghost {
        background: #ffffff;
        color: #374151;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.88rem;
        font-weight: 500;
        transition: background 0.15s ease, border-color 0.15s ease;
        text-decoration: none;
    }

    .btn-ghost:hover {
        background: #f3f4f6;
        border-color: #d1d5db;
        color: #111827;
    }
</style>

<div class="container py-4" style="max-width: 720px;">

    <!-- Breadcrumb -->
    <nav class="wr-crumb mb-2">
        <a href="{% url 'my_work_reports' %}">Work Reports</a>
        <span class="sep"><i class="bi bi-chevron-right"></i></span>
        <span style="color:#374151;">Submit Report</span>
    </nav>

    <!-- Page heading -->
    <div class="wr-page-head mb-4">
        <h2><i class="bi bi-journal-text me-2" style="color:var(--brand);"></i>Submit Work Report</h2>
        <p>Manually enter your daily or weekly work activities.</p>
    </div>

    <!-- Form card -->
    <div class="wr-card">
        <form method="POST" action="{% url 'submit_work_report' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="wr-card-head">
                <span class="dot"></span>
                <h6>Report Details</h6>
            </div>

            <div class="wr-card-body">
                <div class="mb-4">
                    <label class="f-label" for="title">Report Title / Date</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Daily Report - 17 Sep" required>
                </div>

                <div class="mb-4">
                    <label class="f-label" for="description">Work Activities (Manual Entry)</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe any other tasks completed..."></textarea>
                </div>

                <div class="mb-4">
                    <label class="f-label" for="excel_file">Upload Excel Report (Optional)</label>
                    <input type="file" class="form-control" id="excel_file" name="excel_file" accept=".xls,.xlsx,.csv">
                </div>
            </div>

            <div class="wr-card-foot">
                <a href="{% url 'my_work_reports' %}" class="btn-ghost">Cancel</a>
                <button type="submit" class="btn-brand">
                    <i class="bi bi-send me-1"></i> Submit Report
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
