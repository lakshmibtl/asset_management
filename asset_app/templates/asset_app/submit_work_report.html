{% extends 'asset_app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-journal-text fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Submit Work Report</h4>
                    <p class="text-muted">Manually enter your daily or weekly work activities.</p>
                </div>
                
                <form method="POST" action="{% url 'submit_work_report' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="title" class="form-label fw-semibold text-dark">Report Title / Date</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" id="title" name="title" placeholder="e.g. Daily Report - 17 Sep" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold text-dark">Other Work Activities (Manual Entry)</label>
                        <textarea class="form-control bg-light border-0" id="description" name="description" rows="4" placeholder="Describe any other tasks completed..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="excel_file" class="form-label fw-semibold text-dark">Upload Excel Report (Optional)</label>
                        <input type="file" class="form-control form-control-lg bg-light border-0" id="excel_file" name="excel_file" accept=".xls,.xlsx,.csv">
                    </div>
                    
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                            <i class="bi bi-send me-2"></i>Submit Report
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
