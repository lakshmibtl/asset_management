{% extends 'asset_app/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-semibold py-3">
                    <i class="bi bi-shield-lock me-2"></i>Change Password
                </div>
                <div class="card-body p-4">


                    {% if errors %}
                        <div class="alert alert-danger py-2">
                            <ul class="mb-0 ps-3">
                                {% for e in errors %}<li>{{ e }}</li>{% endfor %}
                            </ul>
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">CURRENT PASSWORD</label>
                            <input type="password" name="current_password" class="form-control"
                                placeholder="Enter current password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">NEW PASSWORD</label>
                            <input type="password" name="new_password" class="form-control"
                                placeholder="Enter new password (min 8 characters)" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-muted">CONFIRM NEW PASSWORD</label>
                            <input type="password" name="confirm_password" class="form-control"
                                placeholder="Re-enter new password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check2-circle me-1"></i>Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
